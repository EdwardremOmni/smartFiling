{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow-lg border-0 p-4 app-auth-card">
    <div class="text-center mb-4">
      <img
        src="{{ MEDIA_URL }}logo/Prince_Shipping_Logo_-_1-removebg-preview.png"
        class="app-auth-logo mb-3"
        alt="Prince Shipping"
      />
      <h2 class="fw-bold mb-1">Sign In</h2>
      <p class="text-muted mb-0">Access your Prince Shipping account</p>
    </div>
    {% if error_message %}
      <div class="alert alert-danger py-2 mb-3" role="alert">
        {{ error_message }}
      </div>
    {% endif %}
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>
      <div class="d-grid mb-2">
        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm app-btn-primary">Login</button>
      </div>
    </form>
    <div class="text-center mt-3">
      <small class="text-muted">Forgot your password? Contact your administrator.</small>
    </div>
  </div>
</div>

{% endblock %}
