<div class="table-responsive">
  <table class="table table-hover align-middle mb-0 app-table">
    <thead class="table-light">
      <tr>
        <th>Importer</th>
        <th>Company Name</th>
        <th>Created</th>
        <th class="text-center">Edit</th>
        <th class="text-center">Preview</th>
        <th class="text-center">Download</th>
        <th class="text-center">Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for agreement in agreements %}
      <tr>
        <td class="fw-semibold">{{ agreement.importer.name }}</td>
        <td>{{ agreement.company_name }}</td>
        <td>{{ agreement.created_on|date:"M d, Y" }}</td>
        <td class="text-center">
          <a
            href="{% url 'edit_agreement' agreement.id %}"
            class="btn btn-outline-primary btn-sm rounded-pill px-3"
            hx-boost="false"
            hx-get="{% url 'edit_agreement' agreement.id %}"
            hx-target="#modal-body"
            hx-push-url="false"
          >
            <i class="fas fa-edit me-1"></i>Edit
          </a>
        </td>
        <td class="text-center">
          <a
            href="{% url 'preview_agreement' agreement.id %}"
            class="btn btn-outline-info btn-sm rounded-pill px-3"
            hx-boost="false"
            target="_blank"
            rel="noopener"
          >
            <i class="fas fa-eye me-1"></i>Preview
          </a>
        </td>
        <td class="text-center">
          <a
            href="{% url 'download_agreement' agreement.id %}"
            class="btn btn-outline-success btn-sm rounded-pill px-3"
            hx-boost="false"
          >
            <i class="fas fa-download me-1"></i>Download
          </a>
        </td>
        <td class="text-center">
          <a
            href="{% url 'delete_agreement' agreement.id %}"
            class="btn btn-outline-danger btn-sm rounded-pill px-3"
            onclick="return confirm('Are you sure you want to delete this agreement?');"
          >
            <i class="fas fa-trash-alt me-1"></i>Delete
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="7" class="text-center text-muted py-4">No agreements found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
