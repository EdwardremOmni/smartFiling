<div class="app-pagehead">
  <div>
    <h1 class="app-title"><i class="fas fa-file-contract me-2 text-primary"></i>Agreements</h1>
    <p class="app-subtitle">Upload and manage importer agreements.</p>
  </div>
  <div class="d-flex gap-2">
    <a
      href="{% url 'add_agreement' %}"
      class="btn btn-primary app-btn-primary rounded-pill px-4"
      hx-boost="false"
      hx-get="{% url 'add_agreement' %}"
      hx-target="#modal-body"
      hx-push-url="false"
    >
      <i class="fas fa-plus me-2"></i>Add Agreement
    </a>
  </div>
</div>

<div class="card app-card">
  <div class="card-body">
    <div class="row g-2 align-items-center mb-3">
      <div class="col-md-6">
        <div class="input-group app-input-group">
          <span class="input-group-text bg-light"><i class="fas fa-magnifying-glass"></i></span>
          <input
            id="agreement-search"
            class="form-control"
            type="search"
            name="q"
            value="{{ query|default:'' }}"
            placeholder="Search by importer or company name..."
            hx-get="{% url 'agreement_list' %}"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#agreement-table"
            hx-include="#agreement-per-page"
            hx-vals='{"page":1}'
            hx-push-url="true"
          />
        </div>
      </div>

      <div class="col-md-3 ms-md-auto">
        <div class="input-group app-input-group">
          <span class="input-group-text bg-light">Rows</span>
          <select
            id="agreement-per-page"
            class="form-select"
            name="per_page"
            hx-get="{% url 'agreement_list' %}"
            hx-trigger="change"
            hx-target="#agreement-table"
            hx-include="#agreement-search"
            hx-vals='{"page":1}'
            hx-push-url="true"
          >
            <option value="10" {% if per_page|default:50 == 10 %}selected{% endif %}>10</option>
            <option value="25" {% if per_page|default:50 == 25 %}selected{% endif %}>25</option>
            <option value="50" {% if per_page|default:50 == 50 %}selected{% endif %}>50</option>
            <option value="100" {% if per_page|default:50 == 100 %}selected{% endif %}>100</option>
          </select>
        </div>
      </div>
    </div>

    <div id="agreement-table">
      {% include 'partials/agreements/_table.html' %}
    </div>
  </div>
</div>
