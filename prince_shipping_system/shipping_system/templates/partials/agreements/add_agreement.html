<div class="app-pagehead">
  <div>
    <h1 class="app-title"><i class="fas fa-file-contract me-2 text-primary"></i>Add Agreement</h1>
    <p class="app-subtitle">Select importer, enter company name and upload the agreement document.</p>
  </div>
</div>

<div class="card app-card">
  <div class="card-body">
    {% if errors %}
      <div class="alert alert-danger py-2">
        <ul class="mb-0">
          {% for msg in errors %}<li>{{ msg }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label fw-semibold" for="importer">Importer</label>
        <select name="importer" id="importer" class="form-select" required>
          <option value="" disabled selected>Select importer</option>
          {% for importer in importers %}
            <option value="{{ importer.id }}">{{ importer.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="company_name">Company Name</label>
        <input type="text" id="company_name" class="form-control" name="company_name" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold" for="documents">Attach Document</label>
        <input type="file" name="documents" id="documents" class="form-control" accept=".pdf, .png, .jpg, .jpeg" required>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'agreement_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
        <button type="submit" class="btn btn-primary app-btn-primary rounded-pill px-4">Save</button>
      </div>
    </form>
  </div>
</div>
