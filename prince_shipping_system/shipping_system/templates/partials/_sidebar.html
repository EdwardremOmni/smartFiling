<aside
  id="app-sidebar"
  class="app-sidebar"
  {% if sidebar_oob %}hx-swap-oob="outerHTML"{% endif %}
>
  <nav class="app-nav">
    {% if request.user.is_authenticated %}
      <a href="{% url 'home' %}"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>

      {% if request.user.is_staff or request.user.is_superuser %}
        <a href="{% url 'importer_list' %}"><i class="fas fa-users"></i><span>Importers</span></a>
      {% endif %}

      <a href="{% url 'bill_of_entry_list' %}"><i class="fas fa-file-invoice"></i><span>Bills of Entry</span></a>
      <a href="{% url 'agreement_list' %}"><i class="fas fa-file-contract"></i><span>Agreements</span></a>
      <a href="{% url 'internal_document_list' %}"><i class="fas fa-folder-open"></i><span>Documents</span></a>

      {% if request.user.is_staff or request.user.is_superuser %}
        <a href="{% url 'user_list' %}"><i class="fas fa-user-friends"></i><span>Users</span></a>
      {% endif %}

      <a href="{% url 'my_account' %}"><i class="fas fa-user-circle"></i><span>My Account</span></a>
      <hr class="my-2" />
      <a href="{% url 'logout' %}" hx-boost="false"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
    {% else %}
      <a href="{% url 'user_login' %}" hx-boost="false"><i class="fas fa-right-to-bracket"></i><span>Login</span></a>
    {% endif %}
  </nav>
</aside>
