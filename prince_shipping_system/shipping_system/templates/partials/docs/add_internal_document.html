<div class="app-pagehead">
  <div>
    <h1 class="app-title"><i class="fas fa-folder-plus me-2 text-primary"></i>Add Internal Document</h1>
    <p class="app-subtitle">Upload a new internal document.</p>
  </div>
  <div>
    <a href="{% url 'internal_document_list' %}" class="btn btn-outline-primary rounded-pill px-4">
      <i class="fas fa-arrow-left me-2"></i>Back
    </a>
  </div>
</div>

<div class="card app-card mx-auto" style="max-width: 720px;">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" autocomplete="off" hx-boost="false">
      {% csrf_token %}
      <div class="mb-3">
        <label for="company_name" class="form-label fw-semibold">Company Name</label>
        <div class="input-group app-input-group">
          <span class="input-group-text bg-light"><i class="fas fa-building"></i></span>
          <input type="text" id="company_name" class="form-control" name="company_name" placeholder="Enter company name" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="document_name" class="form-label fw-semibold">Document Name</label>
        <div class="input-group app-input-group">
          <span class="input-group-text bg-light"><i class="fas fa-file-alt"></i></span>
          <input type="text" id="document_name" class="form-control" name="document_name" placeholder="Enter document name" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label fw-semibold">Description</label>
        <textarea class="form-control" id="description" rows="4" name="description" placeholder="Enter description" required></textarea>
      </div>

      <div class="mb-4">
        <label for="documents" class="form-label fw-semibold">Attach Document</label>
        <input type="file" name="documents" id="documents" class="form-control" accept=".pdf, .png, .jpg, .jpeg">
        <small class="text-muted">Accepted: PDF, PNG, JPG.</small>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary app-btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
          <i class="fas fa-save me-2"></i>Save
        </button>
      </div>
    </form>
  </div>
</div>
