<div class="app-pagehead">
  <div>
    <h1 class="app-title"><i class="fas fa-user-edit me-2 text-primary"></i>Edit Importer</h1>
    <p class="app-subtitle">Update importer details.</p>
  </div>
  <div>
    <a href="{% url 'importer_list' %}" class="btn btn-outline-primary rounded-pill px-4">
      <i class="fas fa-arrow-left me-2"></i>Back
    </a>
  </div>
</div>

<div class="card app-card mx-auto" style="max-width: 560px;">
  <div class="card-body">
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <div class="mb-3">
        <label for="importerName" class="form-label fw-semibold">Importer Name</label>
        <div class="input-group app-input-group">
          <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
          <input type="text" id="importerName" class="form-control" name="name" value="{{ importer.name }}" required autofocus>
        </div>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary app-btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
          <i class="fas fa-save me-2"></i>Update
        </button>
      </div>
    </form>
  </div>
</div>
