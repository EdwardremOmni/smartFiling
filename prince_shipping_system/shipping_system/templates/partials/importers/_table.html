<div class="table-responsive">
  <table class="table table-hover align-middle mb-0 app-table">
    <thead class="table-light">
      <tr>
        <th>Importer Name</th>
        <th>Created On</th>
        <th>Updated On</th>
        <th class="text-center">Edit</th>
        <th class="text-center">Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for importer in page_obj %}
      <tr>
        <td class="fw-semibold">{{ importer.name }}</td>
        <td>{{ importer.created_on|date:"M d, Y H:i" }}</td>
        <td>{{ importer.updated_on|date:"M d, Y H:i" }}</td>
        <td class="text-center">
          <a
            href="{% url 'edit_importer' importer.id %}"
            class="btn btn-outline-primary btn-sm rounded-pill px-3"
            hx-boost="false"
            hx-get="{% url 'edit_importer' importer.id %}"
            hx-target="#modal-body"
            hx-push-url="false"
          >
            <i class="fas fa-edit me-1"></i>Edit
          </a>
        </td>
        <td class="text-center">
          <a href="{% url 'delete_importer' importer.id %}" class="btn btn-outline-danger btn-sm rounded-pill px-3"
             onclick="return confirm('Are you sure you want to delete this importer?');">
            <i class="fas fa-trash-alt me-1"></i>Delete
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="5" class="text-center text-muted py-4">No importers found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% include 'partials/_pagination.html' %}
