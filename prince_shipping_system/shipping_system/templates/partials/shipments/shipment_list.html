<div class="app-pagehead">
  <div>
    <h1 class="app-title"><i class="{{ icon }} me-2 text-primary"></i>{{ title }}</h1>
    <p class="app-subtitle">{{ subtitle }}</p>
  </div>

  <div class="d-flex flex-wrap gap-2 justify-content-end">
    {% if can_add %}
      <a
        href="{% url 'add_shipment' %}"
        class="btn btn-primary app-btn-primary rounded-pill px-4"
        hx-boost="false"
        hx-get="{% url 'add_shipment' %}"
        hx-target="#modal-body"
        hx-push-url="false"
      >
        <i class="fas fa-plus me-2"></i>Add Truck/Shipment
      </a>
    {% endif %}

    <a
      class="btn btn-outline-primary rounded-pill px-4"
      href="{% url 'shipments_export_excel' %}?{{ request.GET.urlencode }}{% if request.GET.urlencode %}&{% endif %}status={{ status_code }}"
      hx-boost="false"
    >
      <i class="fas fa-file-excel me-2"></i>Export to Excel
    </a>

    {% if can_export_documents %}
      <a
        class="btn btn-outline-secondary rounded-pill px-4"
        href="{% url 'shipments_export_documents_zip' %}?{{ request.GET.urlencode }}{% if request.GET.urlencode %}&{% endif %}status={{ status_code }}"
        hx-boost="false"
      >
        <i class="fas fa-file-zipper me-2"></i>Export Documents (ZIP)
      </a>
    {% endif %}
  </div>
</div>

<div class="card app-card">
  <div class="card-body">
    <form
      id="shipment-filters"
      class="row g-2 align-items-end mb-3"
      hx-get="{{ base_url }}"
      hx-target="#shipment-cards"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-trigger="keyup changed delay:300ms from:input, change from:select, change from:input"
    >
      <input type="hidden" name="status" value="{{ status_code }}" />

      <div class="col-md-4">
        <label class="form-label fw-semibold mb-1">Search</label>
        <div class="input-group app-input-group">
          <span class="input-group-text bg-light"><i class="fas fa-magnifying-glass"></i></span>
          <input
            class="form-control"
            type="search"
            name="q"
            value="{{ filters.q|default:'' }}"
            placeholder="Search truck, manifest, refs..."
          />
        </div>
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Cill Number</label>
        <input class="form-control" type="text" name="cill_number" value="{{ filters.cill_number|default:'' }}" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Bill of Entry Number</label>
        <input class="form-control" type="text" name="bill_of_entry_number" value="{{ filters.bill_of_entry_number|default:'' }}" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Assessment Number</label>
        <input class="form-control" type="text" name="assessment_number" value="{{ filters.assessment_number|default:'' }}" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Receipt Number</label>
        <input class="form-control" type="text" name="receipt_number" value="{{ filters.receipt_number|default:'' }}" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Truck Registration</label>
        <input class="form-control" type="text" name="truck_registration" value="{{ filters.truck_registration|default:'' }}" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Manifest Number</label>
        <input class="form-control" type="text" name="manifest_number" value="{{ filters.manifest_number|default:'' }}" />
      </div>

      <div class="col-md-2">
        <label class="form-label fw-semibold mb-1">Upload Status</label>
        <select class="form-select" name="upload_status">
          <option value="" {% if not filters.upload_status %}selected{% endif %}>Any</option>
          <option value="required_complete" {% if filters.upload_status == 'required_complete' %}selected{% endif %}>Required Complete</option>
          <option value="missing_required" {% if filters.upload_status == 'missing_required' %}selected{% endif %}>Missing Required</option>
          <option value="any_missing" {% if filters.upload_status == 'any_missing' %}selected{% endif %}>Any Missing</option>
        </select>
      </div>

      <div class="col-md-2">
        <label class="form-label fw-semibold mb-1">Weight Min (kg)</label>
        <input class="form-control" type="number" step="0.01" name="weight_min" value="{{ filters.weight_min|default:'' }}" />
      </div>

      <div class="col-md-2">
        <label class="form-label fw-semibold mb-1">Weight Max (kg)</label>
        <input class="form-control" type="number" step="0.01" name="weight_max" value="{{ filters.weight_max|default:'' }}" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Created From</label>
        <input class="form-control" type="date" name="date_from" value="{{ filters.date_from|default:'' }}" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-semibold mb-1">Created To</label>
        <input class="form-control" type="date" name="date_to" value="{{ filters.date_to|default:'' }}" />
      </div>

      <div class="col-md-2 ms-md-auto">
        <label class="form-label fw-semibold mb-1">Rows</label>
        <select class="form-select" name="per_page">
          <option value="10" {% if per_page|default:50 == 10 %}selected{% endif %}>10</option>
          <option value="25" {% if per_page|default:50 == 25 %}selected{% endif %}>25</option>
          <option value="50" {% if per_page|default:50 == 50 %}selected{% endif %}>50</option>
          <option value="100" {% if per_page|default:50 == 100 %}selected{% endif %}>100</option>
        </select>
      </div>

      <div class="col-12 d-flex justify-content-end">
        <a class="btn btn-sm btn-outline-secondary rounded-pill px-3" href="{{ base_url }}" hx-boost="false">
          <i class="fas fa-rotate-left me-1"></i>Reset
        </a>
      </div>
    </form>

    <div id="shipment-cards">
      {% include 'partials/shipments/_cards.html' %}
    </div>
  </div>
</div>
