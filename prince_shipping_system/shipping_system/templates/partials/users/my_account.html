<div class="app-pagehead">
  <div>
    <h1 class="app-title"><i class="fas fa-user-circle me-2 text-primary"></i>My Account</h1>
    <p class="app-subtitle">Signed in as {{ user.username }}</p>
  </div>
</div>

<div class="card app-card mx-auto" style="max-width: 620px;">
  <div class="card-body">
    <div class="text-center mb-4">
      <i class="fas fa-user-circle fa-4x text-primary mb-3"></i>
      <h3 class="fw-bold mb-1">{{ user.get_full_name|default:user.username }}</h3>
      <p class="text-muted mb-0">{{ user.email }}</p>
    </div>

    <div class="d-grid">
      <a href="{% url 'logout' %}" class="btn btn-danger app-btn-danger btn-lg rounded-pill fw-semibold shadow-sm" hx-boost="false">
        <i class="fas fa-sign-out-alt me-2"></i>Logout
      </a>
    </div>
  </div>
</div>
