<div class="p-4">
  <div class="d-flex align-items-start justify-content-between mb-3">
    <div>
      <h2 class="h4 fw-bold mb-1">{% if user_obj %}Edit User{% else %}Add User{% endif %}</h2>
      <div class="text-muted small">Manage user details.</div>
    </div>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Close</button>
  </div>

  {% if errors %}
    <div class="alert alert-danger py-2">
      <ul class="mb-0">
        {% for msg in errors %}<li>{{ msg }}</li>{% endfor %}
      </ul>
    </div>
  {% endif %}

  <form method="post"
        hx-post="{% if user_obj %}{% url 'edit_user' user_obj.id %}{% else %}{% url 'add_user' %}{% endif %}"
        hx-target="#modal-body"
        hx-swap="innerHTML">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label fw-semibold" for="name">Name</label>
      <div class="input-group app-input-group">
        <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
        <input type="text" id="name" class="form-control" name="name" value="{{ values.name|default:'' }}" required autofocus>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold" for="email">Email</label>
      <div class="input-group app-input-group">
        <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
        <input type="email" id="email" class="form-control" name="email" value="{{ values.email|default:'' }}" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold" for="password">
        Password {% if user_obj %}<span class="text-muted fw-normal">(leave blank to keep current)</span>{% endif %}
      </label>
      <div class="input-group app-input-group">
        <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
        <input type="password" id="password" class="form-control" name="password" {% if not user_obj %}required{% endif %}>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold" for="role">Role</label>
      <select name="role" id="role" class="form-select app-input" required>
        <option value="" disabled {% if not values.role %}selected{% endif %}>Select role</option>
        <option value="Manager" {% if values.role == 'Manager' %}selected{% endif %}>Manager</option>
        <option value="User" {% if values.role == 'User' %}selected{% endif %}>User</option>
      </select>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-primary app-btn-primary rounded-pill px-4">
        <i class="fas fa-save me-2"></i>Save
      </button>
    </div>
  </form>
</div>
