<div class="p-4 app-modal">
  <div class="d-flex align-items-start justify-content-between app-modal-header">
    <div>
      <h2 class="h4 fw-bold mb-1">Add Truck/Shipment</h2>
      <div class="text-muted small">Create a new shipment and optionally upload initial documents.</div>
    </div>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Close</button>
  </div>

  {% if errors %}
    <div class="alert alert-danger py-2">
      <ul class="mb-0">
        {% for msg in errors %}<li>{{ msg }}</li>{% endfor %}
      </ul>
    </div>
  {% endif %}

  <form method="post" enctype="multipart/form-data"
        hx-post="{% url 'add_shipment' %}"
        hx-target="#modal-body"
        hx-swap="innerHTML">
    {% csrf_token %}

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Truck Registration</label>
        <input class="form-control" type="text" name="truck_registration" value="{{ values.truck_registration|default:'' }}" required autofocus />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Manifest Number</label>
        <input class="form-control" type="text" name="manifest_number" value="{{ values.manifest_number|default:'' }}" required />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Weight (kg)</label>
        <input class="form-control" type="number" step="0.01" name="weight_kg" value="{{ values.weight_kg|default:'' }}" required />
      </div>

      <div class="col-12"><hr class="my-1" /></div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Manifest (optional upload)</label>
        <input class="form-control" type="file" name="manifest_file" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Waybill (optional upload)</label>
        <input class="form-control" type="file" name="waybill_file" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Invoice (optional upload)</label>
        <input class="form-control" type="file" name="invoice_file" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">COMESA / SADC Document (optional upload)</label>
        <input class="form-control" type="file" name="comesa_sadc_file" />
      </div>
    </div>

    <div class="d-flex gap-2 justify-content-end mt-4">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-primary app-btn-primary rounded-pill px-4">
        <i class="fas fa-save me-2"></i>Create
      </button>
    </div>
  </form>
</div>
