<div class="p-4">
  <div class="d-flex align-items-start justify-content-between mb-3">
    <div>
      <h2 class="h4 fw-bold mb-1">{% if agreement %}Edit Agreement{% else %}Add Agreement{% endif %}</h2>
      <div class="text-muted small">Select importer, enter company name and upload the agreement document.</div>
    </div>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Close</button>
  </div>

  {% if errors %}
    <div class="alert alert-danger py-2">
      <ul class="mb-0">
        {% for msg in errors %}<li>{{ msg }}</li>{% endfor %}
      </ul>
    </div>
  {% endif %}

  <form method="post"
        enctype="multipart/form-data"
        hx-encoding="multipart/form-data"
        hx-post="{% if agreement %}{% url 'edit_agreement' agreement.id %}{% else %}{% url 'add_agreement' %}{% endif %}"
        hx-target="#modal-body"
        hx-swap="innerHTML">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label fw-semibold" for="importer">Importer</label>
      <div class="input-group app-input-group">
        <span class="input-group-text bg-light"><i class="fas fa-users"></i></span>
        <select name="importer" id="importer" class="form-select" required>
          <option value="" disabled {% if not values.importer %}selected{% endif %}>Select importer</option>
          {% for importer in importers %}
            <option value="{{ importer.id }}" {% if values.importer|default:'' == importer.id|stringformat:'s' %}selected{% endif %}>{{ importer.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold" for="company_name">Company Name</label>
      <div class="input-group app-input-group">
        <span class="input-group-text bg-light"><i class="fas fa-building"></i></span>
        <input type="text" id="company_name" class="form-control" name="company_name" value="{{ values.company_name|default:'' }}" required>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold" for="documents">Attach Document {% if agreement %}(optional){% endif %}</label>
      <input type="file" name="documents" id="documents" class="form-control" accept=".pdf, .png, .jpg, .jpeg">
      <small class="text-muted">Accepted: PDF, PNG, JPG.</small>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-primary app-btn-primary rounded-pill px-4">
        <i class="fas fa-save me-2"></i>Save
      </button>
    </div>
  </form>
</div>
